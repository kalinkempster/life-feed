<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="page">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Spectral:ital,wght@0,300;0,400;0,600;1,300&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #0b0d0e; }
  a { color: #e4e8e8; text-decoration: none; }
  a:hover { color: #6fb3a8; }
  ::selection { background: #6fb3a8; color: #0b0d0e; }
</style>
</helmet>

<div style="background:#0b0d0e; color:#e4e8e8; font-family:Spectral,Georgia,serif; min-height:100vh; display:grid; grid-template-columns:232px 1fr">

  <aside style="border-right:1px solid #1e2325; padding:38px 26px; position:sticky; top:0; align-self:start; height:100vh; display:flex; flex-direction:column">
    <h1 style="font-family:'Instrument Serif',serif; font-size:38px; line-height:0.95; font-weight:400; margin:0 0 6px; color:#f2f5f4">Life of<br>K&#8209;Squared</h1>
    <p style="font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:0.2em; text-transform:uppercase; color:#5f6b6d; margin:0 0 34px">Curated by Claude · daily</p>

    <div style="font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:0.2em; text-transform:uppercase; color:#3f4a4c; border-bottom:1px solid #1e2325; padding-bottom:8px; margin-bottom:12px">Filter</div>
    <div style="display:flex; flex-direction:column; gap:2px">
      <sc-for list="{{ chips }}" as="c" hint-placeholder-count="11">
        <button onClick="{{ c.onClick }}" style="{{ c.style }}" style-hover="color:#f2f5f4; background:#121618">
          <span>{{ c.label }}</span>
          <span style="font-size:9px; color:#4c5759">{{ c.count }}</span>
        </button>
      </sc-for>
    </div>

    <div style="flex:1"></div>
    <div style="font-family:'IBM Plex Mono',monospace; font-size:9px; line-height:1.9; letter-spacing:0.12em; text-transform:uppercase; color:#4c5759; border-top:1px solid #1e2325; padding-top:14px">
      <div>41 live · 16 timely</div>
      <div>Run 19:00 AEST</div>
      <a href="#" style="color:#6fb3a8">Status →</a>
    </div>
  </aside>

  <main style="padding:38px 44px 90px; max-width:900px">
    <sc-for list="{{ editions }}" as="ed" hint-placeholder-count="2">
      <section style="padding-bottom:30px">
        <div style="display:flex; align-items:center; gap:14px; padding:10px 0 6px; position:sticky; top:0; background:#0b0d0e">
          <span style="font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:500; letter-spacing:0.24em; text-transform:uppercase; color:#6fb3a8">{{ ed.label }}</span>
          <span style="flex:1; height:1px; background:#1e2325"></span>
          <span style="font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.18em; color:#4c5759">{{ ed.count }}</span>
        </div>
        <sc-for list="{{ ed.items }}" as="it" hint-placeholder-count="7">
          <article style="{{ it.rowStyle }}" style-hover="background:#101416">
            <div style="{{ it.thumbStyle }}" style-hover="filter:none"></div>
            <div style="min-width:0">
              <h3 style="font-family:Spectral,serif; font-size:19px; font-weight:400; line-height:1.25; margin:0 0 5px; letter-spacing:-0.005em">
                <a href="{{ it.href }}" target="_blank" rel="noopener">{{ it.title }}</a>
              </h3>
              <p style="font-family:Spectral,serif; font-weight:300; font-size:14px; line-height:1.5; color:#8b9799; margin:0; max-width:70ch; text-wrap:pretty">{{ it.note }}</p>
            </div>
            <div style="text-align:right; font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:0.14em; text-transform:uppercase; line-height:1.9; white-space:nowrap">
              <div style="color:#e4e8e8">{{ it.source }}</div>
              <div style="color:#5f6b6d">{{ it.topic }}</div>
              <div style="{{ it.kindStyle }}">{{ it.kind }}</div>
            </div>
          </article>
        </sc-for>
      </section>
    </sc-for>
  </main>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1180,&quot;height&quot;:900}}">
class Component extends DCLogic {
  state = { chip: null, data: null };
  componentDidMount() { import("./feed-data.js").then(m => this.setState({ data: m })); }
  renderVals() {
    const d = this.state.data, chip = this.state.chip;
    const rowFor = c => (c === null ? (d ? d.items.length : "") : (d ? d.apply(d.items, c).length : ""));
    const mk = (label, value) => ({
      label, count: rowFor(value),
      onClick: () => this.setState({ chip: this.state.chip === value ? null : value }),
      style: [
        "font-family:'IBM Plex Mono',monospace", "font-size:10px", "letter-spacing:0.14em",
        "text-transform:uppercase", "text-align:left", "padding:7px 9px", "cursor:pointer",
        "border:0", "display:flex", "justify-content:space-between", "gap:8px", "transition:all .15s",
        "background:" + (chip === value ? "#16211f" : "transparent"),
        "border-left:2px solid " + (chip === value ? "#6fb3a8" : "transparent"),
        "color:" + (chip === value ? "#6fb3a8" : "#8b9799")
      ].join(";")
    });
    const chips = [mk("Everything", null)]
      .concat(d ? d.topics.map(t => mk(t, t)) : [])
      .concat([mk("Timely", "timely"), mk("Evergreen", "evergreen"), mk("✓ Read", "read")]);
    const editions = d ? d.group(d.apply(d.items, chip)).map(ed => ({
      label: ed.label, count: ed.items.length,
      items: ed.items.map(it => ({
        ...it, href: "#",
        rowStyle: "display:grid; grid-template-columns:52px 1fr 96px; gap:18px; align-items:start; padding:14px 10px; border-bottom:1px solid #14191a; transition:background .15s; opacity:" + (it.read ? "0.42" : "1"),
        thumbStyle: "height:52px; filter:saturate(0.1) contrast(0.85); transition:filter .3s; background:linear-gradient(150deg, hsl(" + it.hue + " 40% 44%), hsl(" + ((it.hue + 30) % 360) + " 30% 18%))",
        kindStyle: "color:" + (it.kind === "timely" ? "#6fb3a8" : "#4c5759")
      }))
    })) : [];
    return { chips, editions };
  }
}

</script>
</body>
</html>
