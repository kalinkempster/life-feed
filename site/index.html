<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Life of K²</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,700&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,600;1,6..72,300&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0e0d0c; --paper:#f0ead9; --bright:#f5efe2; --mute:#8a8175; --dim:#6e675c;
          --faint:#5c554b; --rule:#3a352d; --hair:#221f1b; --accent:#d9a45b; --down:#a8776b; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--paper);
               font-family:Newsreader,Georgia,serif; scroll-behavior:smooth; }
  a { color:var(--paper); text-decoration:none; }
  a:hover { color:var(--accent); }
  ::selection { background:var(--accent); color:var(--bg); }
  .mono { font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:.18em; }
  .wrap { max-width:1180px; margin:0 auto; padding:0 46px; }
  header.top { padding-top:52px; }
  .dateline { display:flex; justify-content:space-between; gap:12px; font-size:10px;
              color:var(--mute); padding-bottom:14px; }
  .banner { border-top:1px solid var(--rule); border-bottom:1px solid var(--rule);
            padding:26px 0 22px; text-align:center; }
  h1.masthead { font-family:'Bodoni Moda',serif; font-weight:700; font-size:76px; line-height:.92;
                letter-spacing:-.02em; margin:0; color:var(--bright); }
  h1.masthead sup { font-size:.46em; vertical-align:super; line-height:0; letter-spacing:0; }
  .byline { font-size:10px; letter-spacing:.26em; color:var(--mute); margin:14px 0 0; }

  /* Form controls do not inherit text-transform in every engine, so the mono
     treatment is set explicitly wherever a button carries it. */
  .picker { position:relative; }
  .picker > button { background:none; border:0; padding:0; cursor:pointer; color:var(--mute);
                     font-family:'IBM Plex Mono',monospace; font-size:10px;
                     text-transform:uppercase; letter-spacing:.18em; }
  .picker > button:hover, .picker.open > button { color:var(--bright); }
  .menu { position:absolute; top:22px; right:0; z-index:20; min-width:250px; background:#141210;
          border:1px solid var(--rule); display:none; flex-direction:column;
          box-shadow:0 18px 40px rgba(0,0,0,.55); }
  .picker.open .menu { display:flex; }
  .menu button { background:none; border:0; border-bottom:1px solid var(--hair); cursor:pointer;
                 color:#a09788; font-family:'IBM Plex Mono',monospace; font-size:10px;
                 text-transform:uppercase; letter-spacing:.14em; padding:9px 12px; display:flex;
                 justify-content:space-between; gap:16px; text-align:left; }
  .menu button:hover { background:#1a1509; color:var(--bright); }
  .menu span:last-child { color:var(--faint); }

  .shell { display:grid; grid-template-columns:216px minmax(0,1fr); gap:40px; }
  aside { padding:26px 20px 0 0; position:sticky; top:0; align-self:start; max-height:100vh;
          overflow:auto; border-right:1px solid var(--hair); }

  /* The filter panel collapses on phones, where the rail becomes a stack of
     chips at the top of the page and would otherwise push the feed off screen. */
  .rail-toggle { display:none; width:100%; background:none; border:1px solid var(--rule);
                 color:var(--mute); cursor:pointer; padding:9px 12px; align-items:center;
                 gap:10px; font-family:'IBM Plex Mono',monospace; font-size:10px;
                 text-transform:uppercase; letter-spacing:.18em; }
  .rail-toggle .active { margin-left:auto; color:var(--accent); }
  .rail-toggle .caret { transition:transform .2s; }
  aside.open .rail-toggle .caret { transform:rotate(180deg); }
  .rail-h { font-size:9px; letter-spacing:.22em; color:var(--faint);
            border-bottom:1px solid var(--hair); padding-bottom:8px; margin:0 0 10px; }
  .rail-group + .rail-group { margin-top:22px; }
  .chips { display:flex; flex-direction:column; gap:1px; }
  .chips button { background:none; border:0; border-left:2px solid transparent; cursor:pointer;
                  color:var(--mute); font-family:'IBM Plex Mono',monospace;
                  text-transform:uppercase; letter-spacing:.14em; font-size:10px; padding:7px 9px;
                  display:flex; justify-content:space-between; gap:10px; align-items:center;
                  text-align:left; transition:all .15s; }
  .chips button:hover { background:#17140f; color:var(--bright); }
  .chips button[aria-pressed="true"] { border-left-color:var(--accent); background:#1a1509;
                                       color:var(--accent); }
  .chips .n { font-size:9px; color:var(--faint); font-variant-numeric:tabular-nums; }
  .chips button[aria-pressed="true"] .n { color:var(--accent); }
  .clear { margin-top:20px; width:100%; background:none; border:1px solid var(--rule);
           color:var(--mute); cursor:pointer; padding:8px 10px;
           font-family:'IBM Plex Mono',monospace; font-size:9px; text-transform:uppercase;
           letter-spacing:.16em; transition:all .15s; }
  .clear:hover { color:var(--bright); border-color:var(--accent); background:#1a1509; }

  main { padding-top:26px; min-width:0; }
  .bar { display:flex; align-items:center; gap:14px; border-bottom:1px solid var(--hair);
         padding-bottom:10px; }
  .bar .count { font-size:10px; color:var(--mute); }
  section.edition { padding:34px 0 6px; }
  .ed-head { display:flex; align-items:baseline; gap:16px; border-bottom:2px solid var(--paper);
             padding-bottom:8px; }
  .ed-head h2 { font-family:'Bodoni Moda',serif; font-size:24px; font-weight:400; margin:0;
                color:var(--bright); }
  .ed-head .n { margin-left:auto; font-size:10px; color:var(--mute); }
  article { display:grid; grid-template-columns:1fr 108px; gap:26px; align-items:start;
            padding:22px 12px 22px 0; border-bottom:1px solid var(--hair); transition:background .15s; }
  article:hover { background:#141210; }
  article.read { opacity:.45; }
  article.liked { border-left:2px solid var(--accent); padding-left:12px; margin-left:-14px; }
  .kicker { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding-bottom:7px; }
  .kicker .src { font-size:10px; font-weight:500; color:var(--accent); }
  .kicker .rule { width:12px; height:1px; background:var(--rule); }
  .kicker .topic { font-size:10px; color:var(--dim); }
  .kicker .tick { font-size:10px; color:var(--dim); }

  /* Kind reads as a mark rather than a word: an hourglass for timely, a leaf for
     evergreen. It was the only shouted word in an otherwise quiet kicker line. */
  .kind { display:inline-flex; align-items:center; }
  .kind svg { width:13px; height:13px; display:block; }
  .kind.timely { color:var(--accent); }
  .kind.evergreen { color:var(--dim); }

  /* The source's own icon. Carries the masthead on phones, where a 76px crop of
     an article's og:image reads as noise rather than as a picture. */
  .fav { display:none; width:14px; height:14px; flex:0 0 14px; }
  .fav img { width:100%; height:100%; object-fit:contain; border-radius:2px;
             filter:saturate(.5); }

  article h3 { font-size:27px; font-weight:400; line-height:1.15; letter-spacing:-.01em;
               margin:0 0 8px; }
  article p { font-style:italic; font-weight:300; font-size:16px; line-height:1.45;
              color:#a09788; margin:0; max-width:62ch; text-wrap:pretty; }

  .acts { margin-left:auto; display:flex; align-items:center; gap:2px; opacity:0;
          transition:opacity .18s; }
  article:hover .acts, .acts:focus-within, .acts.set { opacity:1; }
  .acts button { background:none; border:1px solid transparent; cursor:pointer; color:var(--faint);
                 padding:3px 6px; line-height:1; display:flex; align-items:center; gap:4px;
                 font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:.14em;
                 text-transform:uppercase; transition:all .15s; }
  .acts button:hover { color:var(--bright); border-color:var(--rule); background:#1a1509; }
  .acts button:focus-visible { outline:1px solid var(--accent); outline-offset:1px; }
  .acts svg { width:12px; height:12px; display:block; }
  .acts .down svg { transform:rotate(180deg); }
  .acts button[aria-pressed="true"] { color:var(--accent); border-color:var(--rule); }
  .acts .down[aria-pressed="true"] { color:var(--down); }

  article.gone { grid-template-columns:1fr; padding:12px 0; opacity:.5; }
  article.gone .body { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  article.gone .g-label { font-family:'IBM Plex Mono',monospace; font-size:10px;
                          letter-spacing:.16em; text-transform:uppercase; color:var(--dim); }
  article.gone button.undo { background:none; border:1px solid var(--rule); cursor:pointer;
                             color:var(--mute); font-family:'IBM Plex Mono',monospace;
                             font-size:9px; letter-spacing:.16em; text-transform:uppercase;
                             padding:4px 10px; }
  article.gone button.undo:hover { color:var(--bright); background:#1a1509; }

  .thumb { height:76px; border:1px solid var(--rule); background-size:cover;
           background-position:center; filter:saturate(.4) contrast(.95); transition:filter .3s;
           display:flex; align-items:flex-end; justify-content:flex-end; padding:5px; }
  article:hover .thumb { filter:none; }
  .thumb.placeholder { background-image:
      repeating-linear-gradient(135deg, rgba(255,255,255,.09) 0 5px, rgba(0,0,0,.09) 5px 10px),
      linear-gradient(135deg,#4a4438,#241f18); }
  .thumb span { font-family:'IBM Plex Mono',monospace; font-size:8px; color:var(--bg);
                background:rgba(240,234,217,.72); padding:2px 4px; }
  .empty { padding:80px 0; text-align:center; }
  .empty p { font-style:italic; font-size:22px; color:var(--dim); margin:0; }
  .empty .mono { font-size:10px; color:#4a443c; margin-top:12px; }
  footer { margin-top:48px; border-top:1px solid var(--rule); padding-top:16px; display:flex;
           flex-wrap:wrap; gap:10px; justify-content:space-between; font-size:10px;
           letter-spacing:.16em; color:var(--faint); }
  footer a { border-bottom:1px solid var(--rule); }

  .to-top { position:fixed; right:28px; bottom:28px; z-index:30; background:#141210;
            border:1px solid var(--rule); color:var(--mute); cursor:pointer; padding:10px 14px;
            font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.18em;
            text-transform:uppercase; display:flex; align-items:center; gap:8px;
            box-shadow:0 10px 30px rgba(0,0,0,.5);
            opacity:0; transform:translateY(8px); pointer-events:none;
            transition:opacity .22s, transform .22s, color .15s, border-color .15s; }
  .to-top.show { opacity:1; transform:none; pointer-events:auto; }
  .to-top:hover { color:var(--bright); border-color:var(--accent); }
  .to-top:focus-visible { outline:1px solid var(--accent); outline-offset:2px; }

  @media (prefers-reduced-motion: reduce) {
    html, body { scroll-behavior:auto; }
    .to-top, .acts, article, .thumb, .rail-toggle .caret { transition:none; }
  }

  @media (max-width:820px) {
    .wrap { padding:0 20px; }
    header.top { padding-top:30px; }
    h1.masthead { font-size:40px; }
    .dateline .mid { display:none; }
    .shell { grid-template-columns:1fr; gap:0; }
    aside { position:static; max-height:none; border:0; border-bottom:1px solid var(--hair);
            padding:16px 0 12px; }
    .rail-toggle { display:flex; }
    .rail-body { display:none; padding-top:14px; }
    aside.open .rail-body { display:block; }
    .rail-group + .rail-group { margin-top:14px; }
    .rail-h { padding-bottom:6px; margin-bottom:8px; }
    .chips { flex-direction:row; flex-wrap:wrap; gap:6px; }
    .chips button { border:1px solid var(--rule); border-left-width:1px; padding:6px 11px; }
    .chips button[aria-pressed="true"] { background:var(--accent); color:var(--bg);
                                         border-color:var(--accent); }
    .chips button[aria-pressed="true"] .n { color:var(--bg); }
    .clear { margin-top:14px; }

    /* One column: no thumbnail, the source's icon instead. */
    article { grid-template-columns:1fr; gap:0; padding:18px 0; }
    article h3 { font-size:22px; }
    .thumb { display:none; }
    .fav { display:inline-flex; }
    .acts { opacity:1; }
    .to-top { right:16px; bottom:16px; padding:9px 12px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="dateline mono">
      <span>Curated by Claude</span>
      <span class="mid" id="today"></span>
      <span class="picker" id="picker">
        <button type="button" id="picker-btn">Editions ▾</button>
        <div class="menu" id="picker-menu"></div>
      </span>
    </div>
    <div class="banner">
      <h1 class="masthead">Life of K<sup>2</sup></h1>
      <p class="byline mono">Circulation: one · Standards: unreasonable</p>
    </div>
  </header>

  <div class="shell">
    <aside id="aside">
      <button type="button" class="rail-toggle" id="railToggle"
              aria-expanded="false" aria-controls="railBody">
        <span>Filters</span><span class="active" id="railActive"></span><span class="caret">▾</span>
      </button>
      <div class="rail-body" id="railBody"></div>
    </aside>

    <main>
      <div class="bar">
        <span class="count mono" id="result">loading…</span>
      </div>
      <div id="feed"></div>
      <footer class="mono">
        <span id="health"></span>
        <span style="display:flex; gap:16px">
          <a href="status.html" style="color:var(--accent)">Status →</a>
          <a href="feed.json">feed.json</a>
        </span>
      </footer>
    </main>
  </div>
</div>

<button type="button" class="to-top" id="toTop" aria-label="Back to top">↑ <span>Top</span></button>

<script>
const TOPICS = ["medicine","records","photography","fashion","gaming","melbourne","other"];
let ITEMS = [], GENERATED = null, chip = null;

const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const h = it => it._homepage || {};

/* ── Signals ──────────────────────────────────────────────────────────────
   Three things you can say about an item: you read it, you want more like it,
   or it is not for you. Stored locally first so the page responds instantly and
   remembers across reloads, and POSTed to /api/signal so that once Upstash is
   configured they reach the generator and steer curation. Fire-and-forget: a
   failure must never block the interaction. */
const STORE = "lok2:signals";
let LOCAL = {};
const justDismissed = new Set();

function loadLocal() {
  try { LOCAL = JSON.parse(localStorage.getItem(STORE) || "{}") || {}; }
  catch { LOCAL = {}; }
}
function saveLocal() {
  try { localStorage.setItem(STORE, JSON.stringify(LOCAL)); } catch { /* private mode */ }
}

// Local wins: it is the more recent statement. Server state is the build-time baseline.
function reasonOf(it) {
  const local = LOCAL[it.id];
  if (local) return local.reason;
  if (h(it).read) return "read";
  if (h(it).liked) return "interested";
  return null;
}

function send(it, reason) {
  try {
    fetch("api/signal", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: it.id, reason, topic: h(it).topic,
                             source: h(it).source, at: new Date().toISOString() }),
      keepalive: true
    }).catch(() => {});
  } catch { /* nothing here is worth interrupting a click for */ }
}

function setSignal(id, reason) {
  const it = ITEMS.find(x => x.id === id);
  if (!it) return;
  const current = reasonOf(it);

  if (current === reason) {            // clicking the same thing again clears it
    delete LOCAL[id];
    justDismissed.delete(id);
    saveLocal(); send(it, "clear");
  } else {
    LOCAL[id] = { reason, at: new Date().toISOString() };
    if (reason === "irrelevant") justDismissed.add(id); else justDismissed.delete(id);
    saveLocal(); send(it, reason);
  }
  chipsUI(); render();
}

/* ── Filtering ──────────────────────────────────────────────────────────── */
// published_at is a UTC instant; the edition it belongs to is a Melbourne day.
// Slicing the ISO string agreed with local time only while the run happened at
// 09:00 UTC (19:00 AEST). A run after 14:00 UTC is already tomorrow here, and
// slicing filed it under yesterday — merged into an edition already published.
const TZ = "Australia/Melbourne";
const dayKey = new Intl.DateTimeFormat("en-CA",
  { timeZone:TZ, year:"numeric", month:"2-digit", day:"2-digit" });
const dayOf = it => {
  const at = new Date(h(it).published_at || it.date_published || "");
  return isNaN(at) ? "" : dayKey.format(at);
};
// Midday, so neither AEST nor AEDT can push the label onto the adjacent day.
const fmtDay = d => new Date(d + "T12:00:00+10:00").toLocaleDateString("en-AU",
  { weekday:"long", day:"numeric", month:"long", timeZone:TZ });

function match(it) {
  const r = reasonOf(it);
  // Dismissed items leave the site, but not until you have had a chance to undo.
  if (r === "irrelevant" && !justDismissed.has(it.id)) return false;
  if (!chip) return true;
  if (chip === "read") return r === "read";
  if (chip === "liked") return r === "interested";
  if (chip === "timely" || chip === "evergreen") return h(it).kind === chip;
  return h(it).topic === chip;
}

function groups(list) {
  const by = {};
  list.forEach(i => { (by[dayOf(i)] = by[dayOf(i)] || []).push(i); });
  return Object.keys(by).sort().reverse().map(d => ({ date:d, items:by[d] }));
}

const GROUPS = [
  { head: "Topic",  chips: TOPICS.map(t => [t, t]) },
  { head: "Kind",   chips: [["Timely","timely"], ["Evergreen","evergreen"]] },
  { head: "Status", chips: [["Read","read"], ["Liked","liked"]] }
];

function chipsUI() {
  const count = c => { const s = chip; chip = c; const n = ITEMS.filter(match).length; chip = s; return n; };
  document.getElementById("railBody").innerHTML = GROUPS.map(g =>
    '<div class="rail-group"><div class="rail-h mono">' + esc(g.head) + '</div>' +
    '<div class="chips">' + g.chips.map(([label, value]) =>
      '<button type="button" data-chip="' + value + '" aria-pressed="' + (chip === value) +
      '"><span>' + esc(label) + '</span><span class="n">' + count(value) +
      '</span></button>').join("") +
    '</div></div>').join("") +
    (chip ? '<button type="button" class="clear" id="clearFilter">Clear filter</button>' : "");

  document.getElementById("railActive").textContent = chip || "";
}

/* ── Rendering ──────────────────────────────────────────────────────────── */
const THUMB_SVG = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.4 14V6.6L8.6 2c.9 0 1.5.7 1.4 1.6l-.4 2.2h3.1c.9 0 1.5.8 1.3 1.6l-1 4.9c-.1.6-.7 1-1.3 1H5.4zM1.6 14h3.8V6.6H1.6z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>';

const HOURGLASS = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2h7M4.5 14h7M5.5 2v2.6L8 8l2.5-3.4V2M5.5 14v-2.6L8 8l2.5 3.4V14" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const LEAF = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.2 2.8C6.6 2.6 2.8 5.6 2.8 10.2c0 1.2.4 2.2 1 3 5.2.3 9.6-3.4 9.4-10.4z" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/><path d="M3.4 13.2 9.6 6.6" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/></svg>';

function kindMark(kind) {
  const timely = kind === "timely";
  return '<span class="kind ' + (timely ? "timely" : "evergreen") + '" title="' +
    (timely ? "Timely" : "Evergreen") + '" role="img" aria-label="' +
    (timely ? "Timely" : "Evergreen") + '">' + (timely ? HOURGLASS : LEAF) + '</span>';
}

function actions(it) {
  const r = reasonOf(it);
  const btn = (reason, cls, label, inner) =>
    '<button type="button" class="' + cls + '" data-sig="' + reason + '" data-id="' + it.id +
    '" aria-pressed="' + (r === reason) + '" title="' + label + '" aria-label="' + label +
    '">' + inner + '</button>';
  return '<span class="acts' + (r ? " set" : "") + '">' +
    btn("read", "read", "Mark as read", "✓") +
    btn("interested", "up", "More like this", THUMB_SVG) +
    btn("irrelevant", "down", "Not for me — dismiss", THUMB_SVG) +
    '</span>';
}

function row(it) {
  const m = h(it);
  const r = reasonOf(it);

  if (r === "irrelevant") {
    return '<article class="gone"><div class="body">' +
      '<span class="g-label">Dismissed · ' + esc(it.title.slice(0, 54)) + '</span>' +
      '<button type="button" class="undo" data-sig="irrelevant" data-id="' + it.id +
      '">Undo</button></div></article>';
  }

  const thumb = m.image
    ? '<div class="thumb" style="background-image:url(' + esc(m.image) + ')"></div>'
    : '<div class="thumb placeholder"><span>og:image</span></div>';

  // Deliberately not loading="lazy". These are 14px icons, so deferring them saves
  // nothing measurable, and lazy images inside a container that starts display:none
  // (the desktop case) can end up never being fetched at all once it is shown.
  const fav = m.icon
    ? '<span class="fav"><img src="' + esc(m.icon) + '" alt="" width="14" height="14" ' +
      'decoding="async" onerror="this.parentNode.style.display=\'none\'"></span>'
    : "";

  return '<article class="' + (r === "read" ? "read " : "") +
    (r === "interested" ? "liked" : "") + '">' +
    '<div style="min-width:0"><div class="kicker mono">' + fav +
      '<span class="src">' + esc(m.source) + '</span><span class="rule"></span>' +
      '<span class="topic">' + esc(m.topic) + '</span>' +
      kindMark(m.kind) +
      (r === "read" ? '<span class="tick">✓ read</span>' : '') +
      actions(it) +
    '</div><h3><a href="' + esc(it.url) + '" target="_blank" rel="noopener">' +
      esc(it.title) + '</a></h3><p>' + esc(m.note || it.summary || "") + '</p></div>' +
    thumb + '</article>';
}

function render() {
  const list = ITEMS.filter(match);
  document.getElementById("result").textContent = chip
    ? list.length + " of " + ITEMS.length + " · " + chip
    : list.length + " items published";
  const feed = document.getElementById("feed");
  if (!list.length) {
    feed.innerHTML = '<div class="empty"><p>Nothing here under that filter.</p>' +
      '<p class="mono">The generator publishes what it finds, not what fills a slot.</p></div>';
    return;
  }
  feed.innerHTML = groups(list).map(g =>
    '<section class="edition" id="ed-' + g.date + '">' +
    '<div class="ed-head"><h2>' + fmtDay(g.date) + '</h2><span class="n mono">' +
    g.items.length + (g.items.length === 1 ? " item" : " items") + '</span></div>' +
    g.items.map(row).join("") + '</section>').join("");
}

function pickerUI() {
  document.getElementById("picker-menu").innerHTML = groups(ITEMS).map((g, i) =>
    '<button type="button" data-jump="ed-' + g.date + '"><span>' + fmtDay(g.date) +
    '</span><span>' + g.items.length + (i === 0 ? " · current" : "") + '</span></button>').join("");
}

/* ── Interaction ────────────────────────────────────────────────────────── */
document.addEventListener("click", e => {
  const sig = e.target.closest("[data-sig]");
  const chipBtn = e.target.closest("[data-chip]");
  const jump = e.target.closest("[data-jump]");
  const picker = document.getElementById("picker");
  const aside = document.getElementById("aside");

  if (e.target.closest("#railToggle")) {
    const open = aside.classList.toggle("open");
    document.getElementById("railToggle").setAttribute("aria-expanded", String(open));
    return;
  }
  if (e.target.closest("#clearFilter")) {
    chip = null; chipsUI(); render();
    return;
  }

  if (sig) {
    e.preventDefault();
    setSignal(sig.dataset.id, sig.dataset.sig);
  } else if (chipBtn) {
    const v = chipBtn.dataset.chip;
    chip = chip === v ? null : v;
    chipsUI(); render();
  } else if (jump) {
    const target = document.getElementById(jump.dataset.jump);
    if (target) window.scrollTo({ top: target.offsetTop - 24, behavior: "smooth" });
    picker.classList.remove("open");
  } else if (e.target.id === "picker-btn") {
    picker.classList.toggle("open");
  } else {
    picker.classList.remove("open");
  }
});

const toTop = document.getElementById("toTop");
toTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
const onScroll = () => toTop.classList.toggle("show", window.scrollY > 500);
addEventListener("scroll", onScroll, { passive: true });
onScroll();

/* ── Load ───────────────────────────────────────────────────────────────── */
loadLocal();

// site.json is the reading room's feed: everything ever published, with the notes,
// the images and the read-state. feed.json is the dashboard's lean, capped view —
// fall back to it so the page still renders if a run wrote one but not the other.
fetch("site.json", { cache: "no-cache" })
  .then(r => r.ok ? r.json() : Promise.reject(new Error(String(r.status))))
  .catch(() => fetch("feed.json", { cache: "no-cache" }).then(r => r.json()))
  .then(feed => {
    ITEMS = (feed.items || []).slice().sort((a, b) =>
      ((h(b).published_at || b.date_published) || "").localeCompare(
        (h(a).published_at || a.date_published) || ""));
    GENERATED = (feed._homepage || {}).generated;
    const timely = ITEMS.filter(i => h(i).kind === "timely").length;
    document.getElementById("today").textContent =
      new Date(GENERATED || Date.now()).toLocaleDateString("en-AU",
        { weekday:"long", day:"numeric", month:"long" });
    const read = ITEMS.filter(i => reasonOf(i) === "read").length;
    document.getElementById("health").textContent =
      ITEMS.length + " published · " + timely + " timely · " + read + " read" +
      (GENERATED ? " · generated " + new Date(GENERATED).toLocaleTimeString("en-AU",
        { hour:"2-digit", minute:"2-digit" }) : "");
    chipsUI(); pickerUI(); render();
  }).catch(() => {
    document.getElementById("result").textContent = "feed unavailable";
    document.getElementById("feed").innerHTML =
      '<div class="empty"><p>The feed did not load.</p>' +
      '<p class="mono">feed.json is missing or malformed.</p></div>';
  });
</script>
</body>
</html>
