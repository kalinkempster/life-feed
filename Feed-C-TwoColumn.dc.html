<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="page">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,300&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #100e0c; }
  a { color: #ece4d6; text-decoration: none; }
  a:hover { color: #c2724a; }
  ::selection { background: #c2724a; color: #100e0c; }
</style>
</helmet>

<div style="background:#100e0c; color:#ece4d6; font-family:'Source Serif 4',Georgia,serif; min-height:100vh; padding:0 0 90px">

  <header style="max-width:1240px; margin:0 auto; padding:44px 46px 0; display:flex; align-items:flex-end; gap:40px; border-bottom:1px solid #332c24; padding-bottom:22px">
    <h1 style="font-family:'Libre Caslon Display',serif; font-size:52px; line-height:0.9; font-weight:400; margin:0; color:#f4ecdd; letter-spacing:-0.01em">Life of K&#8209;Squared</h1>
    <div style="flex:1"></div>
    <div style="font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:#7d7264; line-height:2; text-align:right">
      <div>A feed curated by Claude</div>
      <div>4 Sept 2026 · 41 live · <a href="#" style="color:#c2724a">status</a></div>
    </div>
  </header>

  <nav style="max-width:1240px; margin:0 auto; padding:16px 46px; display:flex; flex-wrap:wrap; gap:6px; border-bottom:1px solid #201b16">
    <sc-for list="{{ chips }}" as="c" hint-placeholder-count="11">
      <button onClick="{{ c.onClick }}" style="{{ c.style }}" style-hover="color:#f4ecdd; border-color:#c2724a">{{ c.label }}</button>
    </sc-for>
  </nav>

  <main style="max-width:1240px; margin:0 auto; padding:0 46px">
    <sc-for list="{{ editions }}" as="ed" hint-placeholder-count="2">
      <section style="padding:38px 0 10px">
        <div style="display:flex; align-items:baseline; gap:18px; margin-bottom:18px">
          <h2 style="font-family:'Libre Caslon Display',serif; font-size:22px; font-weight:400; margin:0; color:#c2724a">{{ ed.label }}</h2>
          <span style="flex:1; height:1px; background:#332c24"></span>
          <span style="font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:#7d7264">{{ ed.count }}</span>
        </div>
        <div style="display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); column-gap:44px">
          <sc-for list="{{ ed.items }}" as="it" hint-placeholder-count="6">
            <article style="{{ it.rowStyle }}">
              <div style="{{ it.thumbStyle }}" style-hover="filter:none"></div>
              <div style="min-width:0">
                <div style="font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:0.2em; text-transform:uppercase; color:#c2724a; padding-bottom:6px">{{ it.kicker }}</div>
                <h3 style="font-family:'Source Serif 4',serif; font-size:20px; font-weight:400; line-height:1.2; margin:0 0 6px">
                  <a href="{{ it.href }}" target="_blank" rel="noopener">{{ it.title }}</a>
                </h3>
                <p style="font-weight:300; font-size:14.5px; line-height:1.5; color:#968a7a; margin:0; text-wrap:pretty">{{ it.note }}</p>
              </div>
            </article>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </main>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1240,&quot;height&quot;:900}}">
class Component extends DCLogic {
  state = { chip: null, data: null };
  componentDidMount() { import("./feed-data.js").then(m => this.setState({ data: m })); }
  renderVals() {
    const d = this.state.data, chip = this.state.chip;
    const mk = (label, value) => ({
      label,
      onClick: () => this.setState({ chip: this.state.chip === value ? null : value }),
      style: [
        "font-family:'IBM Plex Mono',monospace", "font-size:10px", "letter-spacing:0.16em",
        "text-transform:uppercase", "padding:5px 11px", "cursor:pointer", "transition:all .15s",
        "border-radius:999px",
        "border:1px solid " + (chip === value ? "#c2724a" : "#332c24"),
        "background:" + (chip === value ? "#c2724a" : "transparent"),
        "color:" + (chip === value ? "#100e0c" : "#968a7a")
      ].join(";")
    });
    const chips = [mk("Everything", null)]
      .concat(d ? d.topics.map(t => mk(t, t)) : [])
      .concat([mk("Timely", "timely"), mk("Evergreen", "evergreen"), mk("✓ Read", "read")]);
    const editions = d ? d.group(d.apply(d.items, chip)).map(ed => ({
      label: ed.label,
      count: ed.items.length + " items",
      items: ed.items.map(it => ({
        ...it, href: "#",
        kicker: it.source + " · " + it.topic + (it.read ? " · ✓ read" : ""),
        rowStyle: "display:grid; grid-template-columns:1fr; gap:12px; padding:0 0 26px; margin-bottom:26px; border-bottom:1px solid #201b16; break-inside:avoid; opacity:" + (it.read ? "0.42" : "1"),
        thumbStyle: "height:132px; filter:saturate(0.12) contrast(0.9); transition:filter .3s; background:linear-gradient(140deg, hsl(" + it.hue + " 42% 40%), hsl(" + ((it.hue + 35) % 360) + " 32% 16%))"
      }))
    })) : [];
    return { chips, editions };
  }
}

</script>
</body>
</html>
