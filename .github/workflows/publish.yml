# Manual runs only. The daily edition is produced by a scheduled Claude Code cloud
# routine instead, which does the curation under the Claude subscription rather than
# per-token API billing — see "Curation" in README.md.
#
# The schedule here is deliberately OFF rather than the file being deleted: this
# workflow is still the way to run the API-backed generator on demand, and the way
# to rebuild the published files from the archive without curating at all. It needs
# ANTHROPIC_API_KEY only for the former.

name: publish (manual)

on:
  workflow_dispatch:
    inputs:
      want:
        description: "Target number of items for this run"
        required: false
        default: "8"
      no_curate:
        description: "Rebuild published files from the archive without calling Claude"
        type: boolean
        required: false
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Catches a broken request shape before it costs a curation pass: a wrong
      # model id or a stale thinking parameter is a 400 and an empty edition.
      - name: Self-test (offline, mocked API)
        run: npm test

      - name: Run the generator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_LIBRARY_DB: ${{ secrets.NOTION_LIBRARY_DB }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
          SIGNALS_ENABLED: ${{ vars.SIGNALS_ENABLED }}
        run: |
          node generator/run.mjs \
            --want="${{ github.event.inputs.want || '8' }}" \
            ${{ github.event.inputs.no_curate == 'true' && '--no-curate' || '' }}

      # The gate. A run that produced a feed violating contract v1 must not be
      # pushed — a bad feed deploys itself in about forty seconds otherwise.
      - name: Check contract conformance
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
        run: node generator/verify-feed.mjs

      - name: Commit and push
        run: |
          git config user.name  "life-of-k2 generator"
          git config user.email "kalinkempster@gmail.com"
          git add site/feed.json site/site.json site/status.json archive
          if git diff --cached --quiet; then
            echo "Nothing changed — no commit."
            exit 0
          fi
          COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('site/feed.json','utf8')).items.length)")
          git commit -m "Edition $(date -u +%Y-%m-%d) — ${COUNT} live"
          git push

      # Confirms the deploy actually serves what we just pushed, rather than
      # assuming it did.
      - name: Verify the live site
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
        run: |
          sleep 90
          node generator/verify-feed.mjs --live
